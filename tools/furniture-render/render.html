<!doctype html>
<!-- Renderer mebli: składa scenę z modeli paczki i renderuje ją kamerą izometryczną 2:1 (T:ART-04). -->
<html>
  <head>
    <meta charset="utf-8" />
    <script type="importmap">
      {
        "imports": {
          "three": "/three/build/three.module.js",
          "three/addons/": "/three/examples/jsm/"
        }
      }
    </script>
  </head>
  <body style="margin: 0; background: transparent">
    <script type="module">
      import * as THREE from 'three';
      import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';
      import { MTLLoader } from 'three/addons/loaders/MTLLoader.js';
      import { buildPerson, MOUTH } from './person.js';

      const cache = new Map();
      async function loadModel(name) {
        if (!cache.has(name)) {
          cache.set(
            name,
            (async () => {
              const mtl = await new MTLLoader()
                .setPath('/pack/OBJ/')
                .setResourcePath('/pack/Textures/')
                .loadAsync(`${name}.mtl`);
              mtl.preload();
              const obj = await new OBJLoader()
                .setMaterials(mtl)
                .setPath('/pack/OBJ/')
                .loadAsync(`${name}.obj`);
              obj.traverse((child) => {
                if (!child.isMesh) return;
                const convert = (m) => {
                  const map = m.map ?? null;
                  if (map) {
                    map.colorSpace = THREE.SRGBColorSpace;
                    map.magFilter = THREE.NearestFilter;
                    map.minFilter = THREE.NearestFilter;
                    map.generateMipmaps = false;
                  }
                  return new THREE.MeshStandardMaterial({
                    map,
                    color: map ? 0xffffff : m.color,
                    roughness: 0.85,
                    metalness: 0,
                    flatShading: true,
                  });
                };
                child.material = Array.isArray(child.material)
                  ? child.material.map(convert)
                  : convert(child.material);
                child.castShadow = true;
                child.receiveShadow = true;
              });
              // Tekstury palet wczytują się asynchronicznie — render przed ich wczytaniem daje czarne modele.
              const maps = [];
              obj.traverse((child) => {
                if (!child.isMesh) return;
                for (const m of [child.material].flat()) if (m.map) maps.push(m.map);
              });
              const deadline = Date.now() + 10000;
              while (maps.some((t) => !(t.image && t.image.complete && t.image.naturalWidth > 0))) {
                if (Date.now() > deadline) throw new Error(`Tekstury ${name} nie wczytały się`);
                await new Promise((r) => setTimeout(r, 20));
              }
              for (const t of maps) t.needsUpdate = true;
              return obj;
            })(),
          );
        }
        return (await cache.get(name)).clone(true);
      }

      // Prosty model z prostopadłościanów (dla obiektów spoza paczki).
      function boxes(parts) {
        const group = new THREE.Group();
        for (const p of parts) {
          const mesh = new THREE.Mesh(
            p.cylinder
              ? new THREE.CylinderGeometry(p.size[0] / 2, p.size[0] / 2, p.size[2], 16)
              : new THREE.BoxGeometry(p.size[0], p.size[1], p.size[2]),
            new THREE.MeshStandardMaterial({
              color: p.color,
              roughness: p.roughness ?? 0.6,
              metalness: p.metalness ?? 0,
              flatShading: true,
            }),
          );
          if (p.cylinder) mesh.rotation.x = Math.PI / 2; // oś cylindra wzdłuż z (pion w układzie modelu)
          mesh.position.set(p.at[0], p.at[1], p.at[2] + p.size[2] / 2);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          group.add(mesh);
        }
        return group;
      }

      // spec: { footprint:{w,h}, rotation, metersPerTile, scale (px na 64 px kafla → mnożnik), items:[{model|boxes, at:[x,y,z] m, rotZ:deg, scale}] }
      window.renderSprite = async (spec) => {
        const S = spec.scale ?? 2;
        const k = 32 * S * Math.SQRT2; // px na jednostkę (kafel) wzdłuż osi siatki
        const scene = new THREE.Scene();
        const zup = new THREE.Group();
        zup.rotation.x = -Math.PI / 2;
        for (const item of spec.items) {
          const node = item.model ? await loadModel(item.model) : boxes(item.boxes);
          node.position.set(...item.at);
          node.rotation.z = THREE.MathUtils.degToRad(item.rotZ ?? 0);
          if (Array.isArray(item.scale)) node.scale.set(...item.scale);
          else node.scale.setScalar(item.scale ?? 1);
          zup.add(node);
        }
        const scaled = new THREE.Group();
        scaled.scale.setScalar(1 / spec.metersPerTile);
        scaled.add(zup);
        const { w, h } = spec.footprint;
        const rotated = spec.rotation === 90 || spec.rotation === 270 ? { w: h, h: w } : { w, h };
        const placed = new THREE.Group();
        placed.rotation.y = THREE.MathUtils.degToRad(-spec.rotation);
        placed.position.set(rotated.w / 2, 0, rotated.h / 2);
        placed.add(scaled);
        scene.add(placed);

        // Światło: miękkie otoczenie + kierunkowe z lewej góry ekranu, cień kontaktowy na podłodze.
        scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b0a0, 1.7));
        const sun = new THREE.DirectionalLight(0xffffff, 2.2);
        sun.position.set(rotated.w / 2 - 3, 7, rotated.h / 2 + 1.5);
        sun.target.position.set(rotated.w / 2, 0, rotated.h / 2);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        Object.assign(sun.shadow.camera, {
          left: -5,
          right: 5,
          top: 5,
          bottom: -5,
          near: 0.1,
          far: 30,
        });
        sun.shadow.radius = 4;
        sun.shadow.bias = -0.0005;
        scene.add(sun, sun.target);
        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(20, 20),
          new THREE.ShadowMaterial({ opacity: 0.22 }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(rotated.w / 2, 0.001, rotated.h / 2);
        floor.receiveShadow = true;
        floor.visible = spec.shadow !== false;
        scene.add(floor);

        // Warstwa mebla: cięcie poziomą płaszczyzną na wysokości `clip.heightM` (m) — zostaje część
        // poniżej (`keep: 'below'`) albo powyżej. Cień zawsze z całej bryły (clipShadows = false).
        if (spec.clip) {
          const y = spec.clip.heightM / spec.metersPerTile;
          const plane =
            spec.clip.keep === 'below'
              ? new THREE.Plane(new THREE.Vector3(0, -1, 0), y)
              : new THREE.Plane(new THREE.Vector3(0, 1, 0), -y);
          placed.traverse((child) => {
            if (!child.isMesh) return;
            for (const m of [child.material].flat()) {
              m.clippingPlanes = [plane];
              m.clipShadows = false;
            }
          });
        }

        // Kamera izometryczna 2:1: azymut 45°, elewacja 30°.
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
        const el = THREE.MathUtils.degToRad(30);
        const dir = new THREE.Vector3(
          Math.cos(el) / Math.SQRT2,
          Math.sin(el),
          Math.cos(el) / Math.SQRT2,
        );
        camera.position.copy(dir.clone().multiplyScalar(50));
        camera.up.set(0, 1, 0);
        camera.lookAt(0, 0, 0);
        camera.updateMatrixWorld();
        scene.updateMatrixWorld(true);

        // Obrys w przestrzeni widoku: wierzchołki modeli i narożniki footprintu.
        const view = camera.matrixWorldInverse;
        let minU = Infinity,
          maxU = -Infinity,
          minV = Infinity,
          maxV = -Infinity,
          maxY = 0;
        const add = (p) => {
          maxY = Math.max(maxY, p.y);
          const q = p.clone().applyMatrix4(view);
          minU = Math.min(minU, q.x);
          maxU = Math.max(maxU, q.x);
          minV = Math.min(minV, q.y);
          maxV = Math.max(maxV, q.y);
        };
        placed.traverse((child) => {
          if (!child.isMesh) return;
          const pos = child.geometry.attributes.position;
          const v = new THREE.Vector3();
          for (let i = 0; i < pos.count; i++)
            add(v.fromBufferAttribute(pos, i).applyMatrix4(child.matrixWorld));
        });
        for (const [x, z] of [
          [0, 0],
          [rotated.w, 0],
          [rotated.w, rotated.h],
          [0, rotated.h],
        ])
          add(new THREE.Vector3(x, 0, z));
        const pad = 6 / k; // margines na cień i wygładzanie
        let left = minU - pad,
          top = maxV + pad;
        const width = Math.ceil((maxU + pad - left) * k),
          height = Math.ceil((top - (minV - pad)) * k);
        // Kotwica w pełnym pikselu: przesuwamy ramkę, żeby narożnik (0,0) footprintu wypadł na całych pikselach.
        const o = new THREE.Vector3(0, 0, 0).applyMatrix4(view);
        const ax = (o.x - left) * k,
          ay = (top - o.y) * k;
        left -= (Math.ceil(ax) - ax) / k;
        top += (Math.ceil(ay) - ay) / k;
        Object.assign(camera, { left, right: left + width / k, top, bottom: top - height / k });
        camera.updateProjectionMatrix();

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          preserveDrawingBuffer: true,
        });
        renderer.setPixelRatio(1);
        renderer.setSize(width, height);
        renderer.setClearColor(0x000000, 0);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.localClippingEnabled = true;
        renderer.render(scene, camera);
        const dataURL = renderer.domElement.toDataURL('image/png');
        renderer.dispose();
        return {
          dataURL,
          width,
          height,
          anchorX: Math.round((o.x - left) * k),
          anchorY: Math.round((top - o.y) * k),
          heightPx: Math.round(((maxY * k * Math.cos(el)) / Math.SQRT2) * Math.SQRT2),
          scale: S,
        };
      };

      // Wspólne: światło, cień kontaktowy, kamera izometryczna 2:1 (azymut 45°, elewacja 30°).
      function stage(scene, center, spread) {
        scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b0a0, 1.7));
        const sun = new THREE.DirectionalLight(0xffffff, 2.2);
        sun.position.set(center.x - 3, 7, center.z + 1.5);
        sun.target.position.copy(center);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        Object.assign(sun.shadow.camera, {
          left: -spread,
          right: spread,
          top: spread,
          bottom: -spread,
          near: 0.1,
          far: 30,
        });
        sun.shadow.radius = 4;
        sun.shadow.bias = -0.0005;
        scene.add(sun, sun.target);
        const floor = new THREE.Mesh(
          new THREE.PlaneGeometry(20, 20),
          new THREE.ShadowMaterial({ opacity: 0.22 }),
        );
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(center.x, 0.001, center.z);
        floor.receiveShadow = true;
        floor.name = 'shadow-floor';
        scene.add(floor);
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 200);
        const el = THREE.MathUtils.degToRad(30);
        camera.position.set(
          (Math.cos(el) / Math.SQRT2) * 50,
          Math.sin(el) * 50,
          (Math.cos(el) / Math.SQRT2) * 50,
        );
        camera.lookAt(0, 0, 0);
        camera.updateMatrixWorld();
        return camera;
      }

      const CHARACTER_SUPERSAMPLE = 3;
      // Uniesienie dłoni z papierosem w kolejnych klatkach animacji `smoke` (1 = przy ustach).
      const SMOKE_LIFT = [1, 1, 0.5, 0, 0, 0.5];

      // Pozy (kąty w radianach; obrót wokół X: ujemny = do przodu). `seat` — wysokość siedziska (m).
      function pose(p, kind, phase, seat) {
        const set = (j, x, z = 0) => p[j].rotation.set(x, 0, z);
        for (const j of ['thighL', 'thighR', 'kneeL', 'kneeR', 'spine', 'elbowL', 'elbowR'])
          set(j, 0);
        set('shoulderL', 0, -0.06);
        set('shoulderR', 0, 0.06);
        p.hips.position.y = 0.9;
        p.cup.visible = false;
        p.cigarette.visible = false;
        const wave = Math.sin(phase * Math.PI * 2);
        if (kind === 'idle') {
          set('spine', 0.015 * wave);
          set('shoulderL', 0.03 * wave, -0.06);
          set('shoulderR', -0.03 * wave, 0.06);
        }
        if (kind === 'walk') {
          set('thighL', -0.45 * wave);
          set('thighR', 0.45 * wave);
          set('kneeL', Math.max(0, wave) * 0.7);
          set('kneeR', Math.max(0, -wave) * 0.7);
          set('shoulderL', 0.4 * wave, -0.06);
          set('shoulderR', -0.4 * wave, 0.06);
          set('elbowL', -0.25);
          set('elbowR', -0.25);
          p.hips.position.y = 0.9 - Math.abs(Math.cos(phase * Math.PI * 2)) * 0.02;
        }
        if (kind === 'sitChair' || kind === 'typing' || kind === 'sitSofa') {
          set('thighL', -Math.PI / 2 + 0.05, 0.05);
          set('thighR', -Math.PI / 2 + 0.05, -0.05);
          set('kneeL', Math.PI / 2 - 0.05);
          set('kneeR', Math.PI / 2 - 0.05);
          p.hips.position.y = seat + 0.07;
          if (kind === 'sitSofa') {
            set('spine', 0.18);
            set('shoulderL', 0.25, -0.15);
            set('shoulderR', 0.25, 0.15);
            set('elbowL', -0.6);
            set('elbowR', -0.6);
          }
          if (kind === 'sitChair') {
            set('shoulderL', -0.3, -0.08);
            set('shoulderR', -0.3, 0.08);
            set('elbowL', -0.9);
            set('elbowR', -0.9);
          }
          if (kind === 'typing') {
            set('spine', -0.08);
            set('shoulderL', -0.75 - 0.06 * wave, -0.12);
            set('shoulderR', -0.75 + 0.06 * wave, 0.12);
            set('elbowL', -0.85);
            set('elbowR', -0.85);
          }
        }
        if (kind === 'coffee') {
          // Łyk kawy: kubek w prawej ręce wędruje do ust i z powrotem.
          const lift = (1 - Math.cos(phase * Math.PI * 2)) / 2;
          set('shoulderR', -0.45 - 0.35 * lift, 0.15);
          set('elbowR', -1.5 - 0.6 * lift);
          p.cup.visible = true;
        }
        if (kind === 'smoke') {
          // Zaciągnięcie: dłoń przy ustach w dwóch pierwszych klatkach, potem przy piersi. Kąty
          // przy ustach dobrane tak, by nasada papierosa wypadła w ustach (FK ramienia).
          const lift = SMOKE_LIFT[Math.round(phase * SMOKE_LIFT.length) % SMOKE_LIFT.length];
          const mix = (low, high) => low + (high - low) * lift;
          set('shoulderR', mix(-0.35, -1.428), mix(0.12, -0.133));
          set('elbowR', mix(-1.1, -1.84), mix(0, -0.569));
          set('shoulderL', 0.02 * wave, -0.06);
          p.cigarette.visible = true;
        }
      }

      // Papieros celuje zawsze w tę samą stronę względem postaci (od ust w przód i lekko w dół),
      // niezależnie od ułożenia dłoni.
      function aimCigarette(p) {
        p.root.updateWorldMatrix(true, true);
        const rootQ = p.root.getWorldQuaternion(new THREE.Quaternion());
        const handQ = p.handR.getWorldQuaternion(new THREE.Quaternion());
        const aim = new THREE.Quaternion().setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          new THREE.Vector3(-0.18, -0.05, 0.98).normalize(),
        );
        p.cigarette.quaternion.copy(handQ.invert().multiply(rootQ).multiply(aim));
      }

      // Dym wtopiony w klatki: kłęby to kilka low-poly brył, każda żyje jedną pętlę animacji
      // (wiek liczony modulo liczba klatek, na końcu życia w pełni wygasa), więc pętla nie ma
      // skoku. Wstążka unosi się z żaru przez całą pętlę, a wydech idzie z ust po zaciągnięciu.
      function createSmoke(holder) {
        const geometry = new THREE.IcosahedronGeometry(1, 1);
        const puffs = [];
        const puff = () => {
          const mesh = new THREE.Mesh(
            geometry,
            new THREE.MeshBasicMaterial({ color: 0xf4f4f0, transparent: true, depthWrite: false }),
          );
          mesh.visible = false;
          holder.add(mesh);
          puffs.push(mesh);
          return mesh;
        };
        // Współrzędne modelu w metrach; „w lewo na ekranie” dla kierunku py to (-x, +z).
        const LEFT = new THREE.Vector3(-Math.SQRT1_2, 0, Math.SQRT1_2);
        const UP = new THREE.Vector3(0, 1, 0);
        const FORWARD = new THREE.Vector3(0, 0, 1);
        return {
          // Pozycje żaru we wszystkich klatkach — wstążka zaczyna się tam, gdzie żar był.
          sampleEmbers(person, frames, seat) {
            const embers = [];
            for (let i = 0; i < frames; i++) {
              pose(person, 'smoke', i / frames, seat);
              aimCigarette(person);
              person.root.updateWorldMatrix(true, true);
              embers.push(holder.worldToLocal(person.ember.getWorldPosition(new THREE.Vector3())));
            }
            return embers;
          },
          show(embers, frame) {
            const frames = embers.length;
            let used = 0;
            const put = (at, radius, opacity) => {
              const mesh = puffs[used] ?? puff();
              used += 1;
              mesh.position.copy(at);
              mesh.scale.setScalar(radius);
              mesh.material.opacity = opacity;
              mesh.visible = true;
            };
            const age = (born) => (((frame - born + frames) % frames) + 0.5) / frames;
            // Wstążka z żaru: dwie bryły na klatkę, gęsto, żeby czytała się jako ciągła smuga.
            for (let k = 0; k < frames * 2; k++) {
              const born = k / 2;
              const t = age(born);
              const wobble = 0.02 * Math.sin((t + born / frames) * Math.PI * 4);
              put(
                embers[Math.floor(born)]
                  .clone()
                  .addScaledVector(UP, 0.02 + 0.55 * t)
                  .addScaledVector(LEFT, 0.05 * t + wobble),
                0.016 + 0.042 * t,
                0.85 * Math.min(1, (1 - t) * 1.6),
              );
            }
            // Wydech z ust po zaciągnięciu: kilka kłębów w chmurce.
            for (const [born, side, rise] of [
              [2, 0, 0],
              [2, 0.05, -0.04],
              [3, -0.03, 0.03],
              [3, 0.06, 0],
              [4, 0.02, -0.02],
            ]) {
              const t = age(born);
              put(
                MOUTH.clone()
                  .addScaledVector(FORWARD, 0.05 + 0.14 * t)
                  .addScaledVector(UP, 0.02 + rise + 0.42 * t)
                  .addScaledVector(LEFT, 0.04 + side + 0.13 * t),
                0.035 + 0.085 * t,
                0.9 * Math.min(1, (1 - t) * 1.5),
              );
            }
          },
          hide() {
            for (const mesh of puffs) mesh.visible = false;
          },
        };
      }

      // Atlas postaci: kierunki × animacje w jednej siatce klatek, zakodowany jako WebP z alfą.
      // spec: { look, metersPerTile, heightM, box:{w,h,up} (kafle), scale, quality,
      //         facings:[{name, angle}], anims:[{name, frames, seat?}] }
      window.renderCharacterAtlas = async (spec) => {
        const S = spec.scale ?? 2;
        const k = 32 * S * Math.SQRT2;
        const scene = new THREE.Scene();
        const person = buildPerson(spec.look);
        const holder = new THREE.Group();
        holder.scale.setScalar(spec.heightM / 1.72 / spec.metersPerTile);
        holder.add(person.root);
        scene.add(holder);
        const camera = stage(scene, new THREE.Vector3(0, 0, 0), 3);
        // Gładkie powierzchnie: bez tego cień własny robi pasy na krągłościach.
        scene.traverse((node) => {
          if (node.isDirectionalLight) node.shadow.normalBias = 0.012;
        });
        const frameWidth = Math.round(spec.box.w * k);
        const frameHeight = Math.round(spec.box.h * k);
        // `box.left` — odległość kotwicy od lewej krawędzi ramki; domyślnie środek.
        const anchorX =
          spec.box.left === undefined ? Math.round(frameWidth / 2) : Math.round(spec.box.left * k);
        const anchorY = Math.round(spec.box.up * k);
        Object.assign(camera, {
          left: -anchorX / k,
          right: (frameWidth - anchorX) / k,
          top: anchorY / k,
          bottom: -(frameHeight - anchorY) / k,
        });
        camera.updateProjectionMatrix();
        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          preserveDrawingBuffer: true,
        });
        renderer.setPixelRatio(1);
        // Nadpróbkowanie: render większy niż klatka — tekstury i drobne rysy twarzy bez migotania.
        renderer.setSize(frameWidth * CHARACTER_SUPERSAMPLE, frameHeight * CHARACTER_SUPERSAMPLE);
        renderer.setClearColor(0x000000, 0);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        const columns = spec.anims.reduce((sum, a) => sum + a.frames, 0);
        const atlas = document.createElement('canvas');
        atlas.width = frameWidth * columns;
        atlas.height = frameHeight * spec.facings.length;
        const ctx = atlas.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        const layout = {};
        let column = 0;
        for (const anim of spec.anims) {
          layout[anim.name] = { start: column, frames: anim.frames };
          column += anim.frames;
        }
        // Sam cień: postać nadal go rzuca, ale nie jest widoczna.
        if (spec.shadowOnly) {
          person.root.traverse((node) => {
            if (!node.material) return;
            node.material = node.material.clone();
            node.material.colorWrite = false;
            node.material.depthWrite = false;
          });
        }
        const smoke = createSmoke(holder);
        spec.facings.forEach((facing, row) => {
          holder.rotation.y = THREE.MathUtils.degToRad(facing.angle);
          for (const anim of spec.anims) {
            // Cień na podłodze jest osobnym obrazkiem wspólnym dla wszystkich postaci (`shadowOnly`).
            const hasShadow = Boolean(spec.shadowOnly);
            scene.getObjectByName('shadow-floor').visible = hasShadow;
            const embers =
              anim.name === 'smoke'
                ? smoke.sampleEmbers(person, anim.frames, anim.seat ?? 0)
                : null;
            for (let i = 0; i < anim.frames; i++) {
              pose(person, anim.name, i / anim.frames, anim.seat ?? 0);
              if (embers) aimCigarette(person);
              renderer.render(scene, camera);
              ctx.drawImage(
                renderer.domElement,
                (layout[anim.name].start + i) * frameWidth,
                row * frameHeight,
                frameWidth,
                frameHeight,
              );
              if (embers) {
                // Dym osobnym przebiegiem, zawsze przed postacią i lekko rozmyty — na małym
                // obrazku bryły inaczej czytają się jak bańki. Przycięty do swojej klatki.
                const x = (layout[anim.name].start + i) * frameWidth;
                const y = row * frameHeight;
                const floor = scene.getObjectByName('shadow-floor');
                person.root.visible = false;
                floor.visible = false;
                smoke.show(embers, i);
                renderer.render(scene, camera);
                ctx.save();
                ctx.beginPath();
                ctx.rect(x, y, frameWidth, frameHeight);
                ctx.clip();
                ctx.filter = `blur(${0.7 * S}px)`;
                ctx.drawImage(renderer.domElement, x, y, frameWidth, frameHeight);
                ctx.restore();
                smoke.hide();
                person.root.visible = true;
                floor.visible = hasShadow;
              }
            }
          }
        });
        renderer.dispose();
        return {
          dataURL: atlas.toDataURL('image/webp', spec.quality ?? 0.85),
          frameWidth,
          frameHeight,
          anchorX,
          anchorY,
          scale: S,
          columns,
          rows: spec.facings.map((f) => f.name),
          layout,
        };
      };

      // Pomieszczenie (podłoga, ściany, drzwi, dekoracje) w siatce gry: X = x pola, Z = y pola,
      // wysokości w metrach. Ten sam kadr dla warstw: `back` — wszystko oprócz ścian przednich,
      // `front` — tylko niskie ściany od strony kamery (w grze nad postaciami).
      // spec: { scale, metersPerTile, layer, floor, walls[], doors[], decor[] }
      window.renderRoom = async (spec) => {
        const S = spec.scale ?? 2;
        const k = 32 * S * Math.SQRT2;
        const M = spec.metersPerTile;
        const T = (m) => m / M;
        const scene = new THREE.Scene();
        const meshMat = (color) =>
          new THREE.MeshStandardMaterial({
            color,
            roughness: 0.85,
            metalness: 0,
            flatShading: true,
          });
        const slab = (x0, z0, x1, z1, y0, y1, color, front = false, partition = false) => {
          const m = new THREE.Mesh(
            new THREE.BoxGeometry(x1 - x0, y1 - y0, z1 - z0),
            meshMat(color),
          );
          m.position.set((x0 + x1) / 2, (y0 + y1) / 2, (z0 + z1) / 2);
          m.castShadow = true;
          // Niskie ściany przednie bez cieni na wierzchu — czysty kolor ściany.
          m.receiveShadow = !front;
          m.userData.front = front;
          m.userData.partition = partition;
          scene.add(m);
          return m;
        };
        const place = async (name, { x, z, y = 0, rotY = 0, scale = 1 }) => {
          const node = await loadModel(name);
          if (Array.isArray(scale)) node.scale.set(...scale);
          else node.scale.setScalar(scale);
          const zup = new THREE.Group();
          zup.rotation.x = -Math.PI / 2;
          zup.add(node);
          const holder = new THREE.Group();
          holder.scale.setScalar(1 / M);
          holder.add(zup);
          const placed = new THREE.Group();
          placed.position.set(x, T(y), z);
          placed.rotation.y = THREE.MathUtils.degToRad(rotY);
          placed.add(holder);
          scene.add(placed);
        };

        // Podłoga: płytki dokładnie na polach pokoju (fuga na granicach pól, jak siatka gry);
        // między ścianą a pierwszym rzędem płytek — pas podłogi bez fug (połowa pola ściany).
        const f = spec.floor;
        const gap = 0.025;
        // `tiles` — jeden prostokąt pól z płytkami albo lista (kilka pokoi; pola ścian działowych
        // i przejść między pokojami mają pas bez fug).
        const tileRects = [f.tiles].flat();
        // Teren na zewnątrz budynku (dojście i taras): płytki na polach jak w pokojach, a pod nimi
        // grubsza płyta — jej bok jest krawężnikiem tarasu. Bez wpływu na światło biura (`floor`).
        const out = spec.outdoor;
        if (out) {
          for (const r of out.tiles) {
            for (let z = r.z0; z < r.z1; z += 1) {
              for (let x = r.x0; x < r.x1; x += 1) {
                const color = out.colors[(x + z) % 2];
                slab(x + gap / 2, z + gap / 2, x + 1 - gap / 2, z + 1 - gap / 2, -0.06, 0, color);
              }
            }
          }
          for (const r of out.strips) slab(r.x0, r.z0, r.x1, r.z1, -0.06, 0, out.border);
          for (const r of [...out.tiles, ...out.strips])
            slab(r.x0, r.z0, r.x1, r.z1, -0.18, -0.05, out.grout);
          for (const r of out.plinths) slab(r.x0, r.z0, r.x1, r.z1, -0.18, 0, out.grout);
          if (out.ashtray) {
            const { x, z } = out.ashtray;
            const cylinder = (radiusM, y0M, y1M, color) => {
              const m = new THREE.Mesh(
                new THREE.CylinderGeometry(T(radiusM), T(radiusM), T(y1M - y0M), 14),
                meshMat(color),
              );
              m.position.set(x, T((y0M + y1M) / 2), z);
              m.castShadow = true;
              m.receiveShadow = true;
              scene.add(m);
            };
            cylinder(0.13, 0, 0.03, 0x3a3d42); // podstawa
            // Niska: sprite'y postaci leżą nad warstwą back, więc wyższa wchodziłaby na buty
            // osoby stojącej za nią na polu (6,16).
            cylinder(0.05, 0.03, 0.36, 0x4d5158); // słupek
            cylinder(0.13, 0.36, 0.45, 0x5d6168); // misa
            cylinder(0.11, 0.45, 0.452, 0xcfc8b4); // piasek
          }
        }
        for (const r of tileRects) {
          for (let z = r.z0; z < r.z1; z += 1) {
            for (let x = r.x0; x < r.x1; x += 1) {
              const color = f.colors[(x + z) % 2];
              slab(x + gap / 2, z + gap / 2, x + 1 - gap / 2, z + 1 - gap / 2, -0.06, 0, color);
            }
          }
        }
        // Pas: reszta podłogi w połówkach pola, łączona w paski wzdłuż X, a paski o tym samym
        // zakresie w kolejnych rzędach — w prostokąty (bez szwów na krawędziach podłogi).
        const tiled = (x, z) =>
          tileRects.some((r) => x >= r.x0 && x < r.x1 && z >= r.z0 && z < r.z1);
        let open = new Map(); // "x0,x1" → z początku
        for (let z = f.z0; z <= f.z1 + 1e-6; z += 0.5) {
          const row = new Set();
          if (z < f.z1 - 1e-6) {
            let start = null;
            for (let x = f.x0; x <= f.x1 + 1e-6; x += 0.5) {
              const border = x < f.x1 - 1e-6 && !tiled(x + 0.25, z + 0.25);
              if (border && start === null) start = x;
              if (!border && start !== null) {
                row.add(`${start},${x}`);
                start = null;
              }
            }
          }
          for (const [key, zStart] of open) {
            if (row.has(key)) continue;
            const [a, b] = key.split(',').map(Number);
            slab(a, zStart, b, z, -0.06, 0, f.border);
          }
          const next = new Map();
          for (const key of row) next.set(key, open.get(key) ?? z);
          open = next;
        }
        slab(f.x0, f.z0, f.x1, f.z1, -0.08, -0.05, f.grout);

        // Ściany: tafla na linii środka pola ściany, z otworami; nad otworem nadproże.
        const t = spec.wallThickness / 2;
        const TALL_WALL_M = Math.max(...spec.walls.map((w) => w.height));
        for (const w of spec.walls) {
          const h = T(w.height);
          // Ściana działowa: `sides` — kolor strony o mniejszej i większej współrzędnej (każda
          // strona w kolorze swojego pokoju); tafla dzielona wzdłuż na dwie połowy grubości.
          const box = (a, b, y0, y1, color, grow = 0) => {
            const halves = w.sides
              ? [
                  [-t - grow, 0, w.sides[0]],
                  [0, t + grow, w.sides[1]],
                ]
              : [[-t - grow, t + grow, color]];
            for (const [p, q, c] of halves) {
              if (w.axis === 'x') slab(a, w.at + p, b, w.at + q, y0, y1, c, w.front, w.partition);
              else slab(w.at + p, a, w.at + q, b, y0, y1, c, w.front, w.partition);
            }
          };
          let from = w.from;
          const parts = [];
          for (const [a, b] of [...(w.openings ?? [])].sort((p, q) => p[0] - q[0])) {
            parts.push([from, a]);
            // Nadproże tylko w wysokiej ścianie; niska ściana działowa ma zwykłą przerwę.
            if (T(w.lintel ?? 2.1) < h) box(a, b, T(w.lintel ?? 2.1), h, w.color);
            from = b;
          }
          parts.push([from, w.to]);
          for (const [a, b] of parts) {
            if (b - a < 1e-6) continue;
            box(a, b, 0, h, w.color);
            if (w.skirting) box(a, b, 0, T(0.08), w.skirting, T(0.015));
            if (w.cap) box(a, b, h, h + 0.012, w.cap);
          }
        }
        // Za drzwiami (po zewnętrznej stronie ściany, niewidocznej dla kamery) zaślepka otworu —
        // światło nie wpada przez okienko drzwi plamą na podłogę; przez szybę widać jasny korytarz.
        // Otwarte drzwi (`open` > 0, skrzydło odchylone na zewnątrz): zaślepki nie ma (skrzydło
        // by przez nią przeszło); za otworem jasne tło „korytarza” poza zasięgiem skrzydła i pas
        // gruntu pod nim — przez otwór nie widać pustki.
        for (const d of spec.doors ?? []) {
          const half = T(0.55);
          const y1 = T(2.1);
          if ((d.open ?? 0) > 0) {
            // Tło tuż za zasięgiem skrzydła, niższe od ściany (dalej w głąb — na ekranie wyżej);
            // nie rzuca cienia, więc słońce wpada przez otwór. Zasłaniacz nad ścianą (tylko
            // głębia) chowa wszystko, co za ścianą wystawałoby ponad nią (górę skrzydła, tło).
            const back = d.at - t - T(1.1);
            const [a0, a1] = [d.center - T(1.9), d.center + T(0.6)];
            // Poza kadrem renderu (`noFrame`): fazy otwarcia mają ten sam kadr co zamknięte tło.
            const quiet = (m) => {
              m.castShadow = false;
              m.userData.noFrame = true;
              return m;
            };
            if (d.axis === 'x') {
              quiet(slab(a0, back - 0.05, a1, back, 0, T(1.35), 0xe8e4da));
              quiet(slab(a0, back, a1, d.at, -0.06, 0, 0xa4a79e));
            } else {
              quiet(slab(back - 0.05, a0, back, a1, 0, T(1.35), 0xe8e4da));
              quiet(slab(back, a0, d.at, a1, -0.06, 0, 0xa4a79e));
            }
            // Cienka płyta przy zewnętrznym licu, od wierzchu ściany w górę: wierzch ściany
            // (bliżej kamery) zostaje widoczny, a to, co dalej, jest zasłonięte.
            const wallTop = T(TALL_WALL_M) - 0.02;
            const outer = d.at - t - 0.01;
            const cap =
              d.axis === 'x'
                ? slab(a0, outer, a1 + 2, outer + 0.01, wallTop, wallTop + T(1.5), 0)
                : slab(outer, a0, outer + 0.01, a1 + 2, wallTop, wallTop + T(1.5), 0);
            cap.castShadow = false;
            cap.userData.noFrame = true;
            cap.renderOrder = -1;
            cap.material = Object.assign(cap.material.clone(), { colorWrite: false });
            continue;
          }
          if (d.axis === 'x')
            slab(d.center - half, d.at - t, d.center + half, d.at - 0.06, 0, y1, 0xe8e4da);
          else slab(d.at - t, d.center - half, d.at - 0.06, d.center + half, 0, y1, 0xe8e4da);
        }
        // Drzwi z paczki w oryginalnym rozmiarze, wyśrodkowane na polu drzwi (płaszczyzna ściany).
        // `hinge`: 'left' (domyślnie, zawiasy po stronie większej współrzędnej wzdłuż ściany) albo
        // 'right' — lustrzane: zawiasy po stronie mniejszej, klamka po przeciwnej. `open` — kąt
        // otwarcia skrzydła na zewnątrz (od pokoju) w stopniach.
        for (const d of spec.doors ?? []) {
          const rot = d.axis === 'x' ? 0 : 90;
          const along = (m) =>
            d.axis === 'x' ? { x: d.center + T(m), z: d.at } : { x: d.at, z: d.center - T(m) };
          const right = d.hinge === 'right';
          const open = d.open ?? 0;
          // `scaleY` — drzwi wyższe w pionie (model ma oś z w górę).
          const tall = [1, 1, d.scaleY ?? 1];
          await place('Door_Frame', { ...along(-0.5), rotY: rot, scale: tall });
          // Skrzydło: oś obrotu modelu to krawędź zawiasów (x = 0). Lustro = obrót o 180°
          // z zawiasami po drugiej stronie otworu; na zewnątrz to −X (ściana x) albo −Z (ściana z).
          const closedRot = right ? rot + 180 : rot;
          const swing = (right ? -1 : 1) * (d.axis === 'z' ? open : -open);
          const hinge = along(right ? 0.505 : -0.505);
          await place(d.leaf, { ...hinge, rotY: closedRot + swing, scale: tall });
          if (d.handle) {
            // Klamka obraca się ze skrzydłem wokół osi zawiasów. Przy drzwiach lustrzanych model
            // klamki jest odbity (nie obrócony): wystaje do pokoju, dźwignia w stronę zawiasów.
            const p = along(right ? -0.38 : 0.38);
            const dx = p.x + (d.axis === 'z' ? T(0.06) : 0) - hinge.x;
            const dz = p.z + (d.axis === 'x' ? T(0.06) : 0) - hinge.z;
            const a = THREE.MathUtils.degToRad(swing);
            await place(d.handle, {
              x: hinge.x + dx * Math.cos(a) + dz * Math.sin(a),
              z: hinge.z - dx * Math.sin(a) + dz * Math.cos(a),
              y: 1.0,
              rotY: rot + swing,
              scale: right ? [-1, 1, 1] : 1,
            });
          }
        }
        for (const item of spec.decor ?? []) await place(item.name, item);

        // Tylko makiety: meble gry w scenie pomieszczenia (te same kompozycje i obroty co sprite'y),
        // żeby ocenić układ przed podpięciem. Do warstw gry nie trafiają.
        for (const prop of spec.props ?? []) {
          const zup = new THREE.Group();
          zup.rotation.x = -Math.PI / 2;
          for (const item of prop.items) {
            const node = item.model ? await loadModel(item.model) : boxes(item.boxes);
            node.position.set(...item.at);
            node.rotation.z = THREE.MathUtils.degToRad(item.rotZ ?? 0);
            if (Array.isArray(item.scale)) node.scale.set(...item.scale);
            else node.scale.setScalar(item.scale ?? 1);
            zup.add(node);
          }
          const scaled = new THREE.Group();
          scaled.scale.setScalar(1 / M);
          scaled.add(zup);
          const { w, h } = prop.footprint;
          const turned = prop.rotation === 90 || prop.rotation === 270;
          const placed = new THREE.Group();
          placed.rotation.y = THREE.MathUtils.degToRad(-prop.rotation);
          placed.position.set(prop.x + (turned ? h : w) / 2, 0, prop.y + (turned ? w : h) / 2);
          placed.add(scaled);
          scene.add(placed);
        }

        // Światło jak przy meblach (ten sam kierunek słońca → spójne cienie).
        const cx = (f.x0 + f.x1) / 2,
          cz = (f.z0 + f.z1) / 2;
        scene.add(new THREE.HemisphereLight(0xffffff, 0xb8b0a0, 1.7));
        const sun = new THREE.DirectionalLight(0xffffff, 2.2);
        sun.position.set(cx - 3, 7, cz + 1.5);
        sun.target.position.set(cx, 0, cz);
        sun.castShadow = true;
        sun.shadow.mapSize.set(4096, 4096);
        const spread = Math.max(f.x1 - f.x0, f.z1 - f.z0) + 4;
        Object.assign(sun.shadow.camera, {
          left: -spread,
          right: spread,
          top: spread,
          bottom: -spread,
          near: 0.1,
          far: 60,
        });
        sun.shadow.radius = 3;
        sun.shadow.bias = -0.0004;
        scene.add(sun, sun.target);

        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 400);
        const el = THREE.MathUtils.degToRad(30);
        const dir = new THREE.Vector3(
          Math.cos(el) / Math.SQRT2,
          Math.sin(el),
          Math.cos(el) / Math.SQRT2,
        );
        camera.position.copy(dir.clone().multiplyScalar(80));
        camera.lookAt(0, 0, 0);
        camera.updateMatrixWorld();
        scene.updateMatrixWorld(true);
        const view = camera.matrixWorldInverse;
        let minU = Infinity,
          maxU = -Infinity,
          minV = Infinity,
          maxV = -Infinity;
        scene.traverse((o) => {
          if (!o.isMesh || o.userData.noFrame) return;
          const pos = o.geometry.attributes.position;
          const v = new THREE.Vector3();
          for (let i = 0; i < pos.count; i++) {
            const q = v.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld).applyMatrix4(view);
            minU = Math.min(minU, q.x);
            maxU = Math.max(maxU, q.x);
            minV = Math.min(minV, q.y);
            maxV = Math.max(maxV, q.y);
          }
        });
        const pad = 4 / k;
        let left = minU - pad,
          top = maxV + pad;
        const width = Math.ceil((maxU + pad - left) * k),
          height = Math.ceil((top - (minV - pad)) * k);
        const o = new THREE.Vector3(0, 0, 0).applyMatrix4(view);
        const ax = (o.x - left) * k,
          ay = (top - o.y) * k;
        left -= (Math.ceil(ax) - ax) / k;
        top += (Math.ceil(ay) - ay) / k;
        Object.assign(camera, { left, right: left + width / k, top, bottom: top - height / k });
        camera.updateProjectionMatrix();

        // Warstwy: `back` — wszystko oprócz ścian przednich i działowych (działowe rzucają cień, ale
        // się nie malują); `front` — tylko niskie ściany od strony kamery; `piece` — ściany działowe
        // przycięte do jednego pola (`spec.piece` = {x, z}), w grze z własną głębokością; `all` —
        // makieta, cała scena. Reszta sceny w `front` i `piece` tylko zasłania (bufor głębi).
        // Materiały modeli są współdzielone z pamięcią podręczną — zmieniamy kopie.
        const withMaterial = (material, props) =>
          Array.isArray(material)
            ? material.map((one) => Object.assign(one.clone(), props))
            : Object.assign(material.clone(), props);
        const depthOnly = (m) => {
          m.material = withMaterial(m.material, { colorWrite: false });
        };
        if (spec.layer === 'front') {
          scene.traverse((m) => {
            if (m.isMesh && !m.userData.front) depthOnly(m);
          });
        } else if (spec.layer === 'piece') {
          const { x, z } = spec.piece;
          // Zakładka ~4 px poza pole: sąsiednie kawałki nachodzą na siebie, więc wygładzony
          // (półprzezroczysty) brzeg cięcia jest przykryty pełnym kolorem sąsiada — bez szwów.
          const lap = 4 / k;
          const planes = [
            new THREE.Plane(new THREE.Vector3(1, 0, 0), -(x - lap)),
            new THREE.Plane(new THREE.Vector3(-1, 0, 0), x + 1 + lap),
            new THREE.Plane(new THREE.Vector3(0, 0, 1), -(z - lap)),
            new THREE.Plane(new THREE.Vector3(0, 0, -1), z + 1 + lap),
          ];
          scene.traverse((m) => {
            if (!m.isMesh) return;
            if (!m.userData.partition) depthOnly(m);
            else m.material = withMaterial(m.material, { clippingPlanes: planes });
          });
        } else if (spec.layer === 'back') {
          scene.traverse((m) => {
            if (!m.isMesh) return;
            if (m.userData.front) m.visible = false;
            if (m.userData.partition) {
              m.material = withMaterial(m.material, { colorWrite: false, depthWrite: false });
            }
          });
        }

        const renderer = new THREE.WebGLRenderer({
          antialias: true,
          alpha: true,
          preserveDrawingBuffer: true,
        });
        renderer.setPixelRatio(1);
        renderer.setSize(width, height);
        renderer.localClippingEnabled = true;
        renderer.setClearColor(0x000000, 0);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.render(scene, camera);
        const anchorX = Math.round((o.x - left) * k);
        const anchorY = Math.round((top - o.y) * k);
        if (spec.layer === 'piece') {
          // Kawałek przycięty do nieprzezroczystych pikseli; kotwica względem wycinka.
          const flat = document.createElement('canvas');
          flat.width = width;
          flat.height = height;
          const ctx = flat.getContext('2d');
          ctx.drawImage(renderer.domElement, 0, 0);
          renderer.dispose();
          const { data } = ctx.getImageData(0, 0, width, height);
          let x0 = width,
            y0 = height,
            x1 = -1,
            y1 = -1;
          for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
              if (data[(y * width + x) * 4 + 3] === 0) continue;
              x0 = Math.min(x0, x);
              y0 = Math.min(y0, y);
              x1 = Math.max(x1, x);
              y1 = Math.max(y1, y);
            }
          }
          if (x1 < 0) return null;
          const crop = document.createElement('canvas');
          crop.width = x1 - x0 + 1;
          crop.height = y1 - y0 + 1;
          crop.getContext('2d').drawImage(flat, -x0, -y0);
          return {
            dataURL: crop.toDataURL('image/png'),
            width: crop.width,
            height: crop.height,
            anchorX: anchorX - x0,
            anchorY: anchorY - y0,
            scale: S,
          };
        }
        const dataURL = renderer.domElement.toDataURL('image/png');
        renderer.dispose();
        return { dataURL, width, height, anchorX, anchorY, scale: S };
      };

      // Fazy otwarcia drzwi: piksele różniące się od zamkniętego tła (`base`) w obszarze `roi`
      // — wspólny prostokąt dla wszystkich faz; klatki wycięte z faz i ułożone w pasek (bez
      // kompresji stratnej — wycinek kładziony na tło nie może mieć widocznego szwu).
      window.doorStrip = async (base, frames, roi) => {
        const load = (url) =>
          new Promise((resolve) => {
            const img = new Image();
            img.onload = () => resolve(img);
            img.src = url;
          });
        const pixels = (img) => {
          const c = document.createElement('canvas');
          c.width = img.width;
          c.height = img.height;
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);
          return ctx.getImageData(0, 0, img.width, img.height).data;
        };
        const baseImg = await load(base);
        const width = baseImg.width;
        const ref = pixels(baseImg);
        const imgs = await Promise.all(frames.map(load));
        let x0 = Infinity,
          y0 = Infinity,
          x1 = -1,
          y1 = -1;
        for (const img of imgs) {
          const data = pixels(img);
          for (let y = roi.y0; y < roi.y1; y++) {
            for (let x = roi.x0; x < roi.x1; x++) {
              const i = (y * width + x) * 4;
              const diff = Math.max(
                Math.abs(data[i] - ref[i]),
                Math.abs(data[i + 1] - ref[i + 1]),
                Math.abs(data[i + 2] - ref[i + 2]),
                Math.abs(data[i + 3] - ref[i + 3]),
              );
              if (diff <= 3) continue;
              x0 = Math.min(x0, x);
              y0 = Math.min(y0, y);
              x1 = Math.max(x1, x);
              y1 = Math.max(y1, y);
            }
          }
        }
        const PAD = 2;
        x0 = Math.max(roi.x0, x0 - PAD);
        y0 = Math.max(roi.y0, y0 - PAD);
        x1 = Math.min(roi.x1 - 1, x1 + PAD);
        y1 = Math.min(roi.y1 - 1, y1 + PAD);
        const w = x1 - x0 + 1,
          h = y1 - y0 + 1;
        // Przezroczysty odstęp między klatkami: przy wygładzaniu tekstury sąsiednia klatka nie
        // przenika na krawędź (brzeg klatki i tak równa się tłu — margines PAD).
        const GAP = 2;
        const strip = document.createElement('canvas');
        strip.width = (w + GAP) * imgs.length - GAP;
        strip.height = h;
        const ctx = strip.getContext('2d');
        imgs.forEach((img, i) => ctx.drawImage(img, x0, y0, w, h, i * (w + GAP), 0, w, h));
        return {
          dataURL: strip.toDataURL('image/png'),
          x: x0,
          y: y0,
          width: w,
          height: h,
          gap: GAP,
        };
      };

      // Atlas kawałków: półki od najwyższego, wiersze do 2048 px. Zwraca obraz i ramki (x, y)
      // w kolejności wejścia.
      window.packAtlas = async (images) => {
        const PAD = 2;
        const MAX = 2048;
        const loaded = await Promise.all(
          images.map(
            (url) =>
              new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = url;
              }),
          ),
        );
        const order = loaded.map((_, i) => i).sort((a, b) => loaded[b].height - loaded[a].height);
        const frames = [];
        let x = 0,
          y = 0,
          row = 0,
          width = 0;
        for (const i of order) {
          const img = loaded[i];
          if (x > 0 && x + img.width > MAX) {
            x = 0;
            y += row + PAD;
            row = 0;
          }
          frames[i] = { x, y };
          x += img.width + PAD;
          width = Math.max(width, x);
          row = Math.max(row, img.height);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = y + row;
        const ctx = canvas.getContext('2d');
        loaded.forEach((img, i) => ctx.drawImage(img, frames[i].x, frames[i].y));
        return { dataURL: canvas.toDataURL('image/png'), frames };
      };

      window.ready = true;
    </script>
  </body>
</html>
